<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#075E54">
<title>SK Phone</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --teal: #075E54;
    --teal-dark: #054D44;
    --green: #25D366;
    --bg: #f0f2f5;
    --panel: #ffffff;
    --text: #111b21;
    --muted: #667781;
    --line: #e9edef;
    --bubble-out: #d9fdd3;
    --chat-bg: #efeae2;
    --red: #ea4335;
    --blue: #34b7f1;
  }
  html, body { height: 100%; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  .hidden { display: none !important; }
  button { cursor: pointer; border: none; font-family: inherit; font-weight: 600; transition: transform .08s ease, filter .15s ease; background: none; }
  button:active { transform: scale(.96); }

  /* ---------- LOGIN ---------- */
  body.login-body { background: linear-gradient(160deg, #075E54, #0b3d38); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  #loginView {
    width: min(380px, 92vw);
    background: #fff;
    border-radius: 18px;
    padding: 40px 32px;
    text-align: center;
    box-shadow: 0 24px 70px rgba(0,0,0,.35);
  }
  .logo {
    width: 84px; height: 84px; margin: 0 auto 18px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #4ade80, #128C7E);
    display: flex; align-items: center; justify-content: center;
    font-size: 40px;
    box-shadow: 0 0 40px rgba(37,211,102,.45);
  }
  h1 { font-size: 26px; font-weight: 700; letter-spacing: .5px; color: #111b21; }
  .tagline { color: var(--muted); font-size: 13.5px; margin: 6px 0 26px; }
  input {
    padding: 14px 16px; border-radius: 12px;
    border: 1.5px solid #dfe5e7; background: #fff;
    color: var(--text); font-size: 15px; outline: none;
  }
  input:focus { border-color: var(--green); }
  .btn-main {
    width: 100%; margin-top: 14px; padding: 14px;
    font-size: 15.5px; border-radius: 12px;
    background: linear-gradient(135deg, #25D366, #128C7E);
    color: #fff;
    box-shadow: 0 8px 24px rgba(18,140,126,.35);
  }
  .btn-main:hover { filter: brightness(1.08); }
  .note { margin-top: 18px; font-size: 12px; color: var(--muted); line-height: 1.6; }

  /* ---------- APP SHELL ---------- */
  #appView { max-width: 760px; margin: 0 auto; min-height: 100vh; background: var(--panel); box-shadow: 0 0 30px rgba(0,0,0,.06); }
  header.app {
    position: sticky; top: 0; z-index: 20;
    background: var(--teal); color: #fff;
    padding: 0 14px;
  }
  .h-row { height: 58px; display: flex; align-items: center; gap: 12px; }
  .h-title { font-size: 19px; font-weight: 700; letter-spacing: .3px; flex: 1; display: flex; align-items: center; gap: 9px; }
  .me-chip {
    display: flex; align-items: center; gap: 7px;
    background: rgba(255,255,255,.14);
    padding: 7px 12px; border-radius: 999px; font-size: 12.5px; font-weight: 600;
    max-width: 46%;
  }
  .me-chip span.nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 7px var(--green); flex-shrink: 0; }

  .tabs { display: flex; }
  .tab {
    flex: 1; text-align: center;
    padding: 11px 4px 10px;
    color: rgba(255,255,255,.62);
    font-size: 13px; font-weight: 700; letter-spacing: 1px;
    border-bottom: 3px solid transparent;
  }
  .tab.on { color: #fff; border-bottom-color: var(--green); }
  .badge {
    min-width: 18px; height: 18px; border-radius: 999px;
    background: var(--green); color: #fff;
    font-size: 11px; font-weight: 700;
    display: inline-flex; align-items: center; justify-content: center;
    padding: 0 5px; vertical-align: 1px; margin-left: 6px;
  }

  main { padding-bottom: 96px; }
  .list-label {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 18px 6px;
    font-size: 12px; font-weight: 700; letter-spacing: 1.2px;
    color: var(--muted); text-transform: uppercase;
  }
  .link-danger { color: var(--red); font-size: 12.5px; font-weight: 600; padding: 4px 8px; border-radius: 8px; }
  .link-danger:hover { background: rgba(234,51,53,.08); }

  /* ---------- ROWS (chats & calls) ---------- */
  .row {
    display: flex; align-items: center; gap: 14px;
    padding: 11px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    cursor: pointer;
  }
  .row:hover { background: #f7f8fa; }
  .row.selected { background: #e7fce3; }
  .avatar {
    width: 49px; height: 49px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 17px; color: #fff;
    flex-shrink: 0;
    text-shadow: 0 1px 2px rgba(0,0,0,.18);
  }
  .r-mid { flex: 1; min-width: 0; }
  .r-name { font-size: 16px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .r-sub { font-size: 13.5px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .r-sub.green { color: #128C7E; font-weight: 600; }
  .r-right { text-align: right; flex-shrink: 0; display: flex; flex-direction: column; align-items: flex-end; gap: 5px; }
  .r-time { font-size: 11.5px; color: var(--muted); }
  .unread-pill {
    min-width: 20px; height: 20px; border-radius: 999px;
    background: var(--green); color: #fff;
    font-size: 11.5px; font-weight: 700;
    display: inline-flex; align-items: center; justify-content: center; padding: 0 6px;
  }
  .check-circle {
    width: 23px; height: 23px; border-radius: 50%;
    border: 2px solid #b8c4ca; background: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; color: transparent; flex-shrink: 0;
  }
  .row.selected .check-circle { background: var(--green); border-color: var(--green); color: #fff; }
  .icon-btn {
    width: 42px; height: 42px; border-radius: 50%;
    font-size: 19px; flex-shrink: 0;
    color: #128C7E;
    display: flex; align-items: center; justify-content: center;
  }
  .icon-btn:hover { background: rgba(18,140,126,.1); }
  .h-icon {
    width: 38px; height: 38px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; flex-shrink: 0;
  }
  .h-icon.out { background: rgba(37,211,102,.15); color: #128C7E; }
  .h-icon.in { background: rgba(52,183,241,.15); color: var(--blue); }
  .h-icon.missed { background: rgba(234,51,53,.12); color: var(--red); }
  .empty-state {
    text-align: center; color: var(--muted);
    padding: 60px 26px; font-size: 14px; line-height: 1.9;
  }
  .empty-state .big { font-size: 44px; margin-bottom: 8px; }

  /* ---------- FAB ---------- */
  #fab {
    position: fixed; right: 20px; bottom: 22px; z-index: 30;
    width: 58px; height: 58px; border-radius: 50%;
    background: var(--green); color: #fff;
    font-size: 25px;
    box-shadow: 0 8px 24px rgba(18,140,126,.45);
    display: flex; align-items: center; justify-content: center;
  }
  body.selecting #fab { display: none; }

  /* ---------- SELECT HEADER ---------- */
  #headerSelect { display: none; align-items: center; gap: 10px; height: 58px; padding: 0 10px; }
  body.selecting #headerSelect { display: flex; }
  body.selecting #headerMain { display: none; }
  #selCancelBtn { color: #fff; font-size: 19px; width: 40px; height: 40px; border-radius: 50%; }
  #selCount { color: #fff; font-size: 15px; font-weight: 600; flex: 1; }
  #selStartBtn {
    background: var(--green); color: #05421f;
    padding: 9px 18px; border-radius: 999px; font-size: 13.5px;
    display: flex; align-items: center; gap: 7px;
  }

  /* ---------- CHAT SCREEN ---------- */
  #chatScreen {
    position: fixed; inset: 0; z-index: 45;
    background: var(--chat-bg);
    display: flex; flex-direction: column;
    transform: translateX(100%);
    transition: transform .22s ease;
  }
  #chatScreen.open { transform: translateX(0); }
  .chat-head {
    background: var(--teal); color: #fff;
    display: flex; align-items: center; gap: 12px;
    padding: 8px 10px;
    flex-shrink: 0;
  }
  .back-btn { color: #fff; font-size: 22px; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  .back-btn:hover { background: rgba(255,255,255,.12); }
  .chat-head .avatar { width: 41px; height: 41px; font-size: 15px; }
  .chat-mid { flex: 1; min-width: 0; }
  .chat-name { font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chat-status { font-size: 12px; opacity: .85; margin-top: 1px; }
  #chatMsgs {
    flex: 1; overflow-y: auto;
    padding: 16px 13px 10px;
    display: flex; flex-direction: column; gap: 5px;
  }
  .b {
    max-width: 80%;
    padding: 7px 11px 6px;
    border-radius: 9px;
    font-size: 14.5px; line-height: 1.45;
    word-wrap: break-word; white-space: pre-wrap;
    box-shadow: 0 1px .5px rgba(0,0,0,.13);
  }
  .b.me { align-self: flex-end; background: var(--bubble-out); border-top-right-radius: 0; }
  .b.them { align-self: flex-start; background: #fff; border-top-left-radius: 0; }
  .b .t { float: right; margin: 8px 0 -3px 9px; font-size: 10.5px; color: #8696a0; }
  .chat-input-row {
    display: flex; gap: 9px; padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
    background: #f0f2f5; flex-shrink: 0;
  }
  #chatInput { flex: 1; border: none; border-radius: 999px; padding: 13px 17px; font-size: 15px; background: #fff; }
  #chatSendBtn {
    width: 49px; height: 49px; border-radius: 50%;
    background: var(--green); color: #fff; font-size: 19px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }

  /* ---------- CALL OVERLAY (dark) ---------- */
  #callOverlay {
    position: fixed; inset: 0; z-index: 60;
    background: linear-gradient(165deg, #0b141a, #1f2c34);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px;
  }
  .call-avatar { animation: pulse 2s infinite; }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(37,211,102,.35); }
    50% { box-shadow: 0 0 0 26px rgba(37,211,102,0); }
  }
  #singleAvatar {
    width: 118px; height: 118px; border-radius: 50%;
    font-size: 44px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; color: #fff;
    text-shadow: 0 1px 2px rgba(0,0,0,.18);
  }
  #callName { font-size: 23px; font-weight: 700; color: #fff; margin-top: 6px; }
  #callStatus { color: #8696a0; font-size: 14px; letter-spacing: .4px; }
  #gridWrap { max-width: 560px; width: 92vw; }
  #pGrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(104px, 1fr)); gap: 12px; justify-items: stretch; }
  .p-tile {
    display: flex; flex-direction: column; align-items: center; gap: 7px;
    padding: 13px 6px; border-radius: 16px;
    background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.09);
  }
  .p-ava {
    width: 60px; height: 60px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 20px; color: #fff;
    text-shadow: 0 1px 2px rgba(0,0,0,.18);
  }
  .p-name { font-size: 12.5px; font-weight: 600; color: #e9edef; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .p-status { font-size: 10.5px; color: #8696a0; }
  .controls { display: flex; gap: 20px; margin-top: 34px; flex-wrap: wrap; justify-content: center; }
  .ctrl {
    width: 63px; height: 63px; border-radius: 50%;
    font-size: 23px; color: #fff;
    background: rgba(255,255,255,.1);
    border: 1px solid rgba(255,255,255,.12);
    display: flex; align-items: center; justify-content: center;
  }
  .ctrl.active-mute { background: rgba(255,255,255,.28); }
  .ctrl.end { background: var(--red); border-color: transparent; box-shadow: 0 10px 30px rgba(234,51,53,.4); }
  .ctrl.warn { background: #f59e0b; border-color: transparent; color: #3b2503; }

  /* ---------- INCOMING MODAL ---------- */
  #incomingModal {
    position: fixed; inset: 0; z-index: 70;
    background: linear-gradient(165deg, #0b141a, #1f2c34);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px;
  }
  #incLabel { color: #8696a0; font-size: 13px; letter-spacing: 1.4px; text-transform: uppercase; }
  #incAvaWrap { margin: 14px 0 4px; }
  #incAvatar {
    width: 110px; height: 110px; border-radius: 50%;
    font-size: 42px; font-weight: 700; color: #fff;
    display: flex; align-items: center; justify-content: center;
    animation: pulse 2s infinite;
    text-shadow: 0 1px 2px rgba(0,0,0,.18);
  }
  #incName { font-size: 24px; font-weight: 700; color: #fff; }
  #incSub { color: #8696a0; font-size: 13.5px; margin-top: 3px; }
  .incoming-actions { display: flex; gap: 44px; justify-content: center; margin-top: 44px; }
  .inc-col { display: flex; flex-direction: column; align-items: center; gap: 9px; }
  .inc-col span { color: #e9edef; font-size: 12.5px; }
  .btn-answer { width: 68px; height: 68px; border-radius: 50%; background: var(--green); color: #fff; font-size: 27px; animation: ring-shake 1s infinite; display: flex; align-items: center; justify-content: center; }
  .btn-decline { width: 68px; height: 68px; border-radius: 50%; background: var(--red); color: #fff; font-size: 25px; display: flex; align-items: center; justify-content: center; }
  @keyframes ring-shake { 0%,100% { transform: rotate(-14deg);} 50% { transform: rotate(14deg);} }

  /* ---------- TOAST ---------- */
  #toast {
    position: fixed; bottom: 92px; left: 50%; transform: translateX(-50%);
    background: #1f2c34; border: 1px solid rgba(255,255,255,.12);
    color: #e9edef; padding: 11px 20px; border-radius: 999px;
    font-size: 13.5px; z-index: 90; opacity: 0; pointer-events: none;
    transition: opacity .25s ease;
    max-width: 88vw; text-align: center;
    box-shadow: 0 8px 26px rgba(0,0,0,.4);
  }
  #toast.show { opacity: 1; }
</style>
</head>
<body class="login-body">

<div id="loginView">
  <div class="logo">📞</div>
  <h1>SK Phone</h1>
  <div class="tagline">Calling • Chat • Groups – Mobile &amp; PC</div>
  <input id="nameInput" maxlength="20" placeholder="Enter your name..." autocomplete="off">
  <input id="serverInput" class="hidden" placeholder="Server address e.g. 192.168.10.2:3000" autocomplete="off" style="margin-top:12px;">
  <button class="btn-main" id="joinBtn">Join</button>
  <div class="note">Enter your name to join.<br>For testing, open another tab (or your phone)<br>and join with a different name.</div>
</div>

<div id="appView" class="hidden">
  <header class="app">
    <div class="h-row" id="headerMain">
      <div class="h-title">📞 SK Phone</div>
      <div class="me-chip"><span class="dot"></span><span class="nm" id="myName">…</span></div>
    </div>
    <div id="headerSelect">
      <button id="selCancelBtn">✕</button>
      <div id="selCount">0 selected</div>
      <button id="selStartBtn">📞 Start Group Call</button>
    </div>
    <div class="tabs">
      <button class="tab on" id="tabChats">CHATS<span id="chatsBadge"></span></button>
      <button class="tab" id="tabCalls">CALLS</button>
    </div>
  </header>

  <main>
    <section id="chatsSection">
      <div class="list-label"><span>Online contacts</span></div>
      <div id="chatList"></div>
    </section>

    <section id="callsSection" class="hidden">
      <div class="list-label">
        <span>Recent calls</span>

<div id="chatScreen">

    <div class="avatar" id="chatAva">?</div>
    <div class="chat-mid">
      <div class="chat-name" id="chatWithName">—</div>
      <div class="chat-status">● online</div>
    </div>
    <button class="icon-btn" id="chatCallBtn" title="Voice call" style="color:#fff;">📞</button>
  </div>
  <div id="chatMsgs"></div>
  <div class="chat-input-row">
    <input id="chatInput" maxlength="2000" placeholder="Type a message..." autocomplete="off">
    <button id="chatSendBtn">➤</button>
  </div>
</div>

<div id="callOverlay" class="hidden">
  <div id="singleWrap" style="display:flex;flex-direction:column;align-items:center;gap:14px;">
    <div class="avatar call-avatar" id="singleAvatar">?</div>
  </div>
  <div id="gridWrap" class="hidden">
    <div id="pGrid"></div>
  </div>
  <div id="callName">—</div>
  <div id="callStatus">Calling…</div>
  <div class="controls">
    <button class="ctrl" id="muteBtn" title="Mute">🎙️</button>
    <button class="ctrl warn hidden" id="endAllBtn" title="End for everyone">📢</button>
    <button class="ctrl end" id="endBtn" title="End Call">📴</button>
  </div>
</div>

<div id="incomingModal" class="hidden">
  <div id="incLabel">Incoming Call</div>
  <div id="incAvaWrap"><div class="avatar" id="incAvatar">?</div></div>
  <div id="incName">—</div>
  <div id="incSub">is calling you...</div>
  <div class="incoming-actions">
    <div class="inc-col"><button class="btn-decline" id="declineBtn">✕</button><span>Decline</span></div>
    <div class="inc-col"><button class="btn-answer" id="answerBtn">✓</button><span>Accept</span></div>
  </div>
</div>

<div id="toast"></div>
<audio id="remoteAudio" autoplay></audio>

<script>
const $ = (id) => document.getElementById(id);

const state = {
  ws: null,
  me: null,
  users: [],
  view: 'chats',
  selecting: false,
  sel: new Set(),
  pc: null,
  localStream: null,
  remoteStream: null,
  peerId: null,
  role: null,
  pendingOffer: null,
  inCall: false,
  ringingOut: false,
  ringingIn: false,
  timerInt: null,
  muted: false,
  callMeta: null,
  chats: new Map(),
  unread: new Map(),
  openChat: null,
  hist: [],
  pendingGroup: null,
  group: { active: false }
};

/* ---------- helpers ---------- */
function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.remove('show'), 2600);
}
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function initials(name) {
  return name.trim().split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase();
}
function fmtDur(sec) {
  sec = Math.max(0, Math.round(sec));
  return String(Math.floor(sec / 60)).padStart(2, '0') + ':' + String(sec % 60).padStart(2, '0');
}
function fmtTime(ts) {
  const d = new Date(ts);
  const now = new Date();
  const hm = d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
  if (d.toDateString() === now.toDateString()) return hm;
  return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short' }) + ' ' + hm;
}
function busy() { return state.inCall || state.ringingOut || state.group.active || !!state.pendingGroup; }
function totalUnread() {
  let n = 0;
  for (const [, v] of state.unread) n += v;
  return n;
}

let audioCtx = null, ringInt = null;
function primeAudio() {
  try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
}
function startRing() {
  stopRing();
  try {
    primeAudio();
    const beep = () => {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = 'sine';
      o.frequency.value = 620;
      g.gain.value = 0.0001;
      o.connect(g).connect(audioCtx.destination);
      o.start();
      g.gain.exponentialRampToValueAtTime(0.12, audioCtx.currentTime + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.5);
      o.stop(audioCtx.currentTime + 0.55);
    };
    beep();
    ringInt = setInterval(beep, 1800);
  } catch (e) {}
}
function stopRing() {
  if (ringInt) { clearInterval(ringInt); ringInt = null; }
}

const DEFAULT_SERVER = '';

const TURN_OPENRELAY = {
  urls: ['turn:openrelay.metered.ca:80', 'turn:openrelay.metered.ca:443', 'turn:openrelay.metered.ca:443?transport=tcp'],
  username: 'openrelayproject',
  credential: 'openrelayproject'
};

const ICE = { iceServers: [
  { urls: ['stun:stun.l.google.com:19302', 'stun:stun1.l.google.com:19302'] },
  { urls: ['stun:openrelay.metered.ca:80'] },
  TURN_OPENRELAY
], iceCandidatePoolSize: 10 };

async function getMic() {
  return navigator.mediaDevices.getUserMedia({
    audio: { echoCancellation: true, noiseSuppression: true }
  });
}

/* ---------- history ---------- */
function loadHist() {
  try { state.hist = JSON.parse(localStorage.getItem('sk_history') || '[]'); }
  catch (e) { state.hist = []; }
}
function logCall(entry) {
  state.hist.unshift(entry);
  if (state.hist.length > 100) state.hist.length = 100;
  try { localStorage.setItem('sk_history', JSON.stringify(state.hist)); } catch (e) {}
  renderHistory();
}
function renderHistory() {
  const list = $('histList');
  list.innerHTML = '';
  if (!state.hist.length) {
    list.innerHTML = '<div class="empty-state"><div class="big">📵</div>No calls yet.<br>Your outgoing, incoming and missed<br>calls will appear here.</div>';
    return;
  }
  for (const h of state.hist) {
    const div = document.createElement('div');
    div.className = 'row';
    let icon, cls, label;
    if (h.type === 'out') { icon = '↗'; cls = 'out'; label = 'Outgoing'; }
    else if (h.type === 'in') { icon = '↙'; cls = 'in'; label = 'Incoming'; }
    else if (h.type === 'out-fail') { icon = '↗'; cls = 'missed'; label = 'No answer'; }
    else { icon = '↙'; cls = 'missed'; label = 'Missed'; }

    div.innerHTML =
      '<div class="h-icon ' + cls + '">' + icon + '</div>' +
      '<div class="r-mid"><div class="r-name"></div><div class="r-sub ' + (cls === 'missed' ? '' : '') + '">' + label + '</div></div>' +
      '<div class="r-right"><div class="r-time">' + fmtTime(h.time) + '</div>' +
      (h.dur > 0 ? '<div class="r-time">⏱ ' + fmtDur(h.dur) + '</div>' : '') + '</div>';

    const redial = document.createElement('button');
    redial.className = 'icon-btn';
    redial.title = 'Call back';
    redial.textContent = cls === 'missed' && h.type !== 'out-fail' ? '📞' : '📞';
    redial.style.color = cls === 'missed' ? '#ea4335' : '#25D366';
    redial.onclick = (e) => {
      e.stopPropagation();
      const u = state.users.find(x => x.name.toLowerCase() === h.name.toLowerCase());
      if (!u || u.id === state.me.id) { toast(h.name + ' is offline right now.'); return; }
      startCall(u.id, u.name);
    };
    div.appendChild(redial);

    div.querySelector('.r-name').textContent = h.name;
    if (cls === 'missed') div.querySelector('.r-sub').style.color = '#ea4335';
    list.appendChild(div);
  }
}

/* ---------- tabs ---------- */
function updateChatsBadge() {
  const n = totalUnread();
  $('chatsBadge').textContent = n > 0 ? (n > 99 ? '99+' : n) : '';
}
function showTab(v) {
  state.view = v;
  $('tabChats').classList.toggle('on', v === 'chats');
  $('tabCalls').classList.toggle('on', v === 'calls');
  $('chatsSection').classList.toggle('hidden', v !== 'chats');
  $('callsSection').classList.toggle('hidden', v !== 'calls');
  if (v !== 'chats') exitSelectMode();
}
$('tabChats').onclick = () => showTab('chats');
$('tabCalls').onclick = () => showTab('calls');
$('clearHistBtn').onclick = () => {
  state.hist = [];
  try { localStorage.removeItem('sk_history'); } catch (e) {}
  renderHistory();
};

/* ---------- websocket ---------- */
function connect(name) {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const host = serverHost() || location.host;
  state.ws = new WebSocket(proto + '://' + host);
  state.ws.onopen = () => state.ws.send(JSON.stringify({ type: 'login', name }));
  state.ws.onmessage = (ev) => {
    let m;
    try { m = JSON.parse(ev.data); } catch { return; }
    handle(m).catch(() => {});
  };
  state.ws.onclose = () => toast('Disconnected from server. Please refresh.');
}
function send(obj) { if (state.ws && state.ws.readyState === 1) state.ws.send(JSON.stringify(obj)); }

async function handle(m) {
  switch (m.type) {
    case 'welcome':
      state.me = m.user;
      $('myName').textContent = m.user.name;
      document.body.classList.remove('login-body');
      $('loginView').classList.add('hidden');
      $('appView').classList.remove('hidden');
      break;

    case 'users':
      state.users = m.users || [];
      renderChatList();
      break;

    case 'offer':
      if (busy()) { send({ type: 'busy', to: m.from }); break; }
      state.pendingOffer = m;
      showIncoming(m.fromName, 'Incoming Call', 'is calling you...');
      break;

    case 'answer':
      if (state.pc && m.from === state.peerId) {
        await state.pc.setRemoteDescription(new RTCSessionDescription(m.payload)).catch(() => {});
      }
      break;

    case 'ice':
      if (state.pc && m.from === state.peerId && m.payload) {
        await state.pc.addIceCandidate(new RTCIceCandidate(m.payload)).catch(() => {});
      }
      break;

    case 'end':
      if (m.from === state.peerId) {
        cleanupCall();
        toast('Call ended by ' + (m.fromName || 'peer'));
      }
      break;

    case 'reject':
      if (m.from === state.peerId) {
        cleanupCall();
        toast((m.fromName || 'User') + ' declined your call.');
      }
      break;

    case 'busy':
      if (m.from === state.peerId) {
        cleanupCall();
        toast((m.fromName || 'User') + ' is busy.');
      }
      break;

    case 'chat': {
      const uid = m.from;
      const arr = state.chats.get(uid) || [];
      arr.push({ mine: false, text: String((m.payload && m.payload.text) || '').slice(0, 2000), time: Date.now() });
      state.chats.set(uid, arr);
      if (state.openChat === uid) renderChat();
      else {
        state.unread.set(uid, (state.unread.get(uid) || 0) + 1);
        toast('💬 ' + m.fromName + ': ' + String((m.payload && m.payload.text) || '').slice(0, 40));
      }
      renderChatList();
      updateChatsBadge();
      break;
    }

    case 'g-invite': {
      if (busy()) { send({ type: 'g-reject', to: m.from, payload: { reason: 'busy' } }); break; }
      state.pendingGroup = { members: m.payload.members || [], from: m.from, fromName: m.fromName };
      showIncoming(m.fromName, 'Incoming Group Call', ((m.payload.members || []).length - 1) + ' participants');
      break;
    }

    case 'g-reject':
      if (state.group.active) {
        const why = m.payload && m.payload.reason === 'busy' ? ' is busy.' : ' declined.';
        toast((m.fromName || 'User') + why);
      }
      break;

    case 'g-join':
      onPeerJoined(m.from);
      break;

    case 'g-offer': {
      if (!state.group.active) break;
      let pc = state.group.pcs.get(m.from);
      if (!pc) pc = await createGroupPc(m.from, false);
      await pc.setRemoteDescription(new RTCSessionDescription(m.payload));
      const ans = await pc.createAnswer();
      await pc.setLocalDescription(ans);
      send({ type: 'g-answer', to: m.from, payload: ans });
      break;
    }

    case 'g-answer': {
      const pc = state.group.pcs.get(m.from);
      if (pc) await pc.setRemoteDescription(new RTCSessionDescription(m.payload)).catch(() => {});
      break;
    }

    case 'g-ice': {
      const pc = state.group.pcs.get(m.from);
      if (pc && m.payload) await pc.addIceCandidate(new RTCIceCandidate(m.payload)).catch(() => {});
      break;
    }

    case 'g-leave':
      groupPeerLeft(m.from, m.fromName);
      break;

    case 'g-end':
      if (state.group.active) {
        cleanupGroup();
        toast('Group call ended by ' + (m.fromName || 'owner'));
      }
      break;
  }
}

/* ---------- rendering: chat list ---------- */
const HUES = [152, 190, 260, 320, 30, 80, 210];
function hueFor(id) { return HUES[id % HUES.length]; }
function avaStyle(id) {
  return 'background:linear-gradient(135deg,hsl(' + hueFor(id) + ',65%,55%),hsl(' + (hueFor(id) + 18) + ',70%,38%))';
}

function renderChatList() {
  const list = $('chatList');
  list.innerHTML = '';
  if (!state.me) return;
  const others = state.users.filter(u => u.id !== state.me.id);

  if (!others.length) {
    list.innerHTML = '<div class="empty-state"><div class="big">👋</div>No one else is online yet.<br>Open SK Phone on your phone or another tab,<br>join with a different name —<br>then you can chat and call.</div>';
    return;
  }

  for (const u of others) {
    const row = document.createElement('div');
    row.className = 'row';
    if (state.selecting) {
      if (state.sel.has(u.id)) row.classList.add('selected');
    }

    const arr = state.chats.get(u.id) || [];
    const last = arr[arr.length - 1];
    const unreadN = state.unread.get(u.id) || 0;
    const preview = last
      ? (last.mine ? 'You: ' : '') + last.text.slice(0, 42)
      : 'Tap to start chatting';

    row.innerHTML =
      '<div class="avatar" style="' + avaStyle(u.id) + '">' + initials(u.name) + '</div>' +
      '<div class="r-mid">' +
        '<div class="r-name"></div>' +
        '<div class="r-sub">' + esc(preview) + '</div>' +
      '</div>';

    if (state.selecting) {
      const right = document.createElement('div');
      right.className = 'check-circle';
      right.innerHTML = '✓';
      row.appendChild(right);
      row.onclick = () => {
        if (state.sel.has(u.id)) { state.sel.delete(u.id); row.classList.remove('selected'); }
        else { state.sel.add(u.id); row.classList.add('selected'); }
        $('selCount').textContent = state.sel.size + ' selected';
      };
    } else {
      const right = document.createElement('div');
      right.className = 'r-right';
      right.innerHTML =
        '<div class="r-time">' + (last ? fmtTime(last.time) : '') + '</div>' +
        (unreadN ? '<div class="unread-pill">' + (unreadN > 9 ? '9+' : unreadN) + '</div>' : '');
      row.appendChild(right);

      const callB = document.createElement('button');
      callB.className = 'icon-btn';
      callB.title = 'Voice call';
      callB.textContent = '📞';
      callB.onclick = (e) => { e.stopPropagation(); startCall(u.id, u.name); };
      row.appendChild(callB);

      row.onclick = () => openChatBy(u.id);
    }

    row.querySelector('.r-name').textContent = u.name;
    list.appendChild(row);
  }
}

/* ---------- selection mode ---------- */
$('fab').onclick = () => {
  if (busy()) { toast('You are already in a call.'); return; }
  showTab('chats');
  state.selecting = true;
  state.sel.clear();
  document.body.classList.add('selecting');
  $('selCount').textContent = '0 selected';
  renderChatList();
};
function exitSelectMode() {
  state.selecting = false;
  state.sel.clear();
  document.body.classList.remove('selecting');
  if (state.view === 'chats') renderChatList();
}
$('selCancelBtn').onclick = exitSelectMode;
$('selStartBtn').onclick = startGroupCall;

/* ---------- 1-to-1 calling ---------- */
function newPeer() {
  const pc = new RTCPeerConnection(ICE);
  pc.onicecandidate = (e) => {
    if (e.candidate && state.peerId) send({ type: 'ice', to: state.peerId, payload: e.candidate });
  };
  pc.ontrack = (e) => {
    state.remoteStream = e.streams[0];
    $('remoteAudio').srcObject = state.remoteStream;
  };
  pc.onconnectionstatechange = () => {
    if (pc.connectionState === 'connected') {
      stopRing();
      if (state.callMeta && !state.callMeta.connectedAt) state.callMeta.connectedAt = Date.now();
      startTimer();
    } else if (pc.connectionState === 'failed') {
      endCall(true);
    }
  };
  return pc;
}

function startTimer() {
  clearInterval(state.timerInt);
  let s = 0;
  state.timerInt = setInterval(() => {
    s++;
    $('callStatus').textContent = fmtDur(s);
  }, 1000);
}

function showSingleUI(name, statusText) {
  $('singleWrap').classList.remove('hidden');
  $('gridWrap').classList.add('hidden');
  $('endAllBtn').classList.add('hidden');
  const av = $('singleAvatar');
  av.textContent = initials(name);
  av.style.background = avaStyle(state.peerId || 0);
  $('callName').textContent = name;
  $('callStatus').textContent = statusText;
  $('muteBtn').classList.remove('active-mute');
  $('muteBtn').textContent = '🎙️';
  state.muted = false;
  $('callOverlay').classList.remove('hidden');
}

function showIncoming(fromName, label, sub) {
  state.ringingIn = true;
  $('incLabel').textContent = label || 'Incoming Call';
  const av = $('incAvatar');
  av.textContent = initials(fromName);
  av.style.background = avaStyle(fromName.length * 7 % 210);
  $('incName').textContent = fromName;
  $('incSub').textContent = sub || 'is calling you...';
  $('incomingModal').classList.remove('hidden');
  startRing();
}

async function startCall(userId, userName) {
  if (busy()) { toast('You are already in a call.'); return; }
  try { state.localStream = await getMic(); }
  catch (e) { toast('Microphone permission denied!'); return; }

  closeChat();
  state.inCall = true;
  state.ringingOut = true;
  state.role = 'caller';
  state.peerId = userId;
  state.callMeta = { startedAt: Date.now(), connectedAt: null, dir: 'out', peerName: userName };
  showSingleUI(userName, 'Calling…');

  state.pc = newPeer();
  for (const track of state.localStream.getTracks()) state.pc.addTrack(track, state.localStream);

  const offer = await state.pc.createOffer();
  await state.pc.setLocalDescription(offer);
  send({ type: 'offer', to: userId, payload: offer });
}

async function answerCall() {
  const m = state.pendingOffer;
  if (!m) return;
  try { state.localStream = await getMic(); }
  catch (e) {
    send({ type: 'reject', to: m.from });
    toast('Cannot accept the call without microphone permission.');
    return;
  }
  state.inCall = true;
  state.role = 'callee';
  state.peerId = m.from;
  state.callMeta = { startedAt: Date.now(), connectedAt: null, dir: 'in', peerName: m.fromName };
  showSingleUI(m.fromName, 'Connecting…');

  state.pc = newPeer();
  for (const track of state.localStream.getTracks()) state.pc.addTrack(track, state.localStream);

  await state.pc.setRemoteDescription(new RTCSessionDescription(m.payload));
  const answer = await state.pc.createAnswer();
  await state.pc.setLocalDescription(answer);
  send({ type: 'answer', to: m.from, payload: answer });
}

function declineCall() {
  const m = state.pendingOffer;
  if (m) {
    send({ type: 'reject', to: m.from });
    logCall({ name: m.fromName || 'Unknown', type: 'missed', time: Date.now(), dur: 0 });
  }
  state.pendingOffer = null;
}

function endCall(notify) {
  if (notify !== false && state.peerId) send({ type: 'end', to: state.peerId });
  cleanupCall();
}

function cleanupCall() {
  clearInterval(state.timerInt);
  stopRing();
  if (state.pc) { try { state.pc.close(); } catch (e) {} }
  if (state.localStream) {
    for (const t of state.localStream.getTracks()) t.stop();
  }
  if (state.callMeta) {
    const meta = state.callMeta;
    const ok = !!meta.connectedAt;
    const dur = ok ? Math.round((Date.now() - meta.connectedAt) / 1000) : 0;
    let type;
    if (meta.dir === 'out') type = ok ? 'out' : 'out-fail';
    else type = ok ? 'in' : 'missed';
    logCall({ name: meta.peerName, type, time: meta.startedAt, dur });
    state.callMeta = null;
  }
  state.pc = null;
  state.localStream = null;
  state.remoteStream = null;
  state.peerId = null;
  state.pendingOffer = null;
  state.inCall = false;
  state.ringingOut = false;
  state.ringingIn = false;
  state.role = null;
  $('remoteAudio').srcObject = null;
  $('callOverlay').classList.add('hidden');
  $('incomingModal').classList.add('hidden');
}

/* ---------- group calling ---------- */
function freshGroupState(owner) {
  return {
    active: true,
    owner,
    pcs: new Map(),
    audio: new Map(),
    joined: new Set([state.me.id]),
    connectAt: null,
    timerInt: null
  };
}

function showGroupUI(members) {
  $('singleWrap').classList.add('hidden');
  $('gridWrap').classList.remove('hidden');
  $('endAllBtn').classList.toggle('hidden', !state.group.owner);
  $('muteBtn').classList.remove('active-mute');
  $('muteBtn').textContent = '🎙️';
  state.muted = false;
  $('callName').textContent = 'Group Call (' + members.length + ')';
  $('callStatus').textContent = 'Waiting…';
  $('callOverlay').classList.remove('hidden');

  const pg = $('pGrid');
  pg.innerHTML = '';
  for (const mem of members) {
    const tile = document.createElement('div');
    tile.className = 'p-tile';
    tile.dataset.uid = mem.id;
    tile.innerHTML =
      '<div class="p-ava" style="' + avaStyle(mem.id) + '">' + initials(mem.name) + '</div>' +
      '<div class="p-name"></div><div class="p-status"></div>';
    tile.querySelector('.p-name').textContent = mem.id === state.me.id ? mem.name + ' (you)' : mem.name;
    tile.querySelector('.p-status').textContent = mem.id === state.me.id ? '' : 'calling…';
    pg.appendChild(tile);
  }
}

function setTileStatus(uid, txt) {
  const tile = document.querySelector('.p-tile[data-uid="' + uid + '"] .p-status');
  if (tile) tile.textContent = txt;
}

async function createGroupPc(peerId, makeOffer) {
  const pc = new RTCPeerConnection(ICE);
  state.group.pcs.set(peerId, pc);
  pc.onicecandidate = (e) => {
    if (e.candidate) send({ type: 'g-ice', to: peerId, payload: e.candidate });
  };
  pc.ontrack = (e) => {
    let el = state.group.audio.get(peerId);
    if (!el) {
      el = document.createElement('audio');
      el.autoplay = true;
      document.body.appendChild(el);
      state.group.audio.set(peerId, el);
    }
    el.srcObject = e.streams[0];
    setTileStatus(peerId, '● live');
    if (!state.group.connectAt) {
      state.group.connectAt = Date.now();
      clearInterval(state.group.timerInt);
      let s = 0;
      state.group.timerInt = setInterval(() => {
        s++;
        $('callStatus').textContent = fmtDur(s);
      }, 1000);
      $('callStatus').textContent = '00:00';
    }
  };
  pc.onconnectionstatechange = () => {
    if (pc.connectionState === 'failed') setTileStatus(peerId, 'connection failed');
  };
  for (const t of state.localStream.getTracks()) pc.addTrack(t, state.localStream);

  if (makeOffer) {
    const off = await pc.createOffer();
    await pc.setLocalDescription(off);
    send({ type: 'g-offer', to: peerId, payload: off });
  }
  return pc;
}

function onPeerJoined(id) {
  if (!state.group.active) return;
  state.group.joined.add(id);
  setTileStatus(id, 'connecting…');
  if (state.me.id < id && !state.group.pcs.has(id)) createGroupPc(id, true);
}

async function startGroupCall() {
  if (busy()) { toast('You are already in a call.'); return; }
  if (!state.sel.size) { toast('Select at least one person.'); return; }
  try { state.localStream = await getMic(); }
  catch (e) { toast('Microphone permission denied!'); return; }

  const members = [
    { id: state.me.id, name: state.me.name },
    ...state.users.filter(u => state.sel.has(u.id))
  ];
  const groupId = 'g' + Date.now();

  Object.assign(state.group, freshGroupState(true));
  exitSelectMode();

  showGroupUI(members);
  for (const mem of members) {
    if (mem.id === state.me.id) continue;
    send({ type: 'g-invite', to: mem.id, payload: { groupId, members } });
  }
}

async function acceptGroup() {
  const pg = state.pendingGroup;
  state.pendingGroup = null;
  if (!pg) return;
  try { state.localStream = await getMic(); }
  catch (e) {
    send({ type: 'g-reject', to: pg.from });
    toast('Cannot join without microphone permission.');
    return;
  }
  Object.assign(state.group, freshGroupState(false));
  showGroupUI(pg.members);
  for (const mem of pg.members) {
    if (mem.id === state.me.id) continue;
    send({ type: 'g-join', to: mem.id });
  }
}

function declineGroup() {
  const pg = state.pendingGroup;
  state.pendingGroup = null;
  if (pg) send({ type: 'g-reject', to: pg.from, payload: { reason: 'declined' } });
}

function groupPeerLeft(id, name) {
  if (!state.group.active) return;
  state.group.joined.delete(id);
  const pc = state.group.pcs.get(id);
  if (pc) { try { pc.close(); } catch (e) {} }
  state.group.pcs.delete(id);
  const el = state.group.audio.get(id);
  if (el) { el.srcObject = null; el.remove(); }
  state.group.audio.delete(id);
  const tile = document.querySelector('.p-tile[data-uid="' + id + '"]');
  if (tile) tile.remove();
  toast(name + ' left the call');
  if (!state.group.owner && state.group.joined.size <= 1) {
    cleanupGroup();
    toast('Everyone left — call closed.');
  }
}

function leaveGroup() {
  if (state.group.active) {
    for (const id of state.group.joined) if (id !== state.me.id) send({ type: 'g-leave', to: id });
  }
  cleanupGroup();
}

function endGroupAll() {
  if (state.group.active) {
    for (const mem of state.group.joined) if (mem !== state.me.id) send({ type: 'g-end', to: mem });
  }
  cleanupGroup();
  toast('Group call ended for everyone.');
}

function cleanupGroup() {
  if (!state.group.active) return;
  clearInterval(state.group.timerInt);
  for (const [, pc] of state.group.pcs) { try { pc.close(); } catch (e) {} }
  for (const [, el] of state.group.audio) { el.srcObject = null; el.remove(); }
  if (state.localStream) for (const t of state.localStream.getTracks()) t.stop();
  state.group = { active: false };
  state.localStream = null;
  $('remoteAudio').srcObject = null;
  $('callOverlay').classList.add('hidden');
}

/* ---------- chat ---------- */
function openChatBy(userId) {
  state.openChat = userId;
  state.unread.delete(userId);
  const u = state.users.find(x => x.id === userId);
  const name = u ? u.name : 'User';
  const av = $('chatAva');
  av.style.cssText = avaStyle(userId);
  av.textContent = initials(name);
  $('chatWithName').textContent = name;
  renderChat();
  $('chatScreen').classList.add('open');
  renderChatList();
  updateChatsBadge();
  setTimeout(() => $('chatInput').focus(), 250);
}
function closeChat() {
  $('chatScreen').classList.remove('open');
  state.openChat = null;
}

function renderChat() {
  const box = $('chatMsgs');
  box.innerHTML = '';
  const arr = state.chats.get(state.openChat) || [];
  if (!arr.length) {
    box.innerHTML = '<div style="text-align:center;color:#8696a0;font-size:13px;margin-top:40px;line-height:1.9;">No messages yet.<br>Say hello! 👋</div>';
    return;
  }
  for (const msg of arr) {
    const div = document.createElement('div');
    div.className = 'b ' + (msg.mine ? 'me' : 'them');
    div.innerHTML = esc(msg.text) + '<span class="t">' + fmtTime(msg.time) + '</span>';
    box.appendChild(div);
  }
  box.scrollTop = box.scrollHeight;
}

function sendChat() {
  const inp = $('chatInput');
  const txt = inp.value.trim();
  if (!txt || state.openChat == null) return;
  const arr = state.chats.get(state.openChat) || [];
  arr.push({ mine: true, text: txt.slice(0, 2000), time: Date.now() });
  state.chats.set(state.openChat, arr);
  send({ type: 'chat', to: state.openChat, payload: { text: txt } });
  inp.value = '';
  renderChat();
  renderChatList();
}

$('chatSendBtn').onclick = sendChat;
$('chatInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') sendChat(); });
$('chatBackBtn').onclick = closeChat;
$('chatCallBtn').onclick = () => {
  if (state.openChat == null) return;
  const u = state.users.find(x => x.id === state.openChat);
  if (u) startCall(u.id, u.name);
};

/* ---------- events ---------- */
const IS_APP = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
if (IS_APP) {
  $('serverInput').classList.remove('hidden');
  $('serverInput').value = localStorage.getItem('sk_server') || DEFAULT_SERVER;
}

function serverHost() {
  if (IS_APP) {
    let sv = ($('serverInput').value || localStorage.getItem('sk_server') || DEFAULT_SERVER).trim();
    sv = sv.replace(/^https?:\/\//i, '').replace(/^wss?:\/\//i, '').replace(/\/+$/, '');
    return sv;
  }
  return location.host;
}

$('joinBtn').onclick = () => {
  const name = $('nameInput').value.trim();
  if (!name) { toast('Please enter your name first.'); return; }
  if (IS_APP && !serverHost()) { toast('Enter the server address first.'); return; }
  if (IS_APP) localStorage.setItem('sk_server', serverHost());
  primeAudio();
  loadHist();
  renderHistory();
  connect(name);
};
$('nameInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('joinBtn').click(); });

$('answerBtn').onclick = () => {
  $('incomingModal').classList.add('hidden');
  stopRing();
  state.ringingIn = false;
  if (state.pendingOffer) answerCall();
  else if (state.pendingGroup) acceptGroup();
};
$('declineBtn').onclick = () => {
  $('incomingModal').classList.add('hidden');
  stopRing();
  state.ringingIn = false;
  if (state.pendingOffer) declineCall();
  else if (state.pendingGroup) declineGroup();
};

$('endBtn').onclick = () => {
  if (state.group.active) leaveGroup();
  else endCall(true);
};
$('endAllBtn').onclick = endGroupAll;

$('muteBtn').onclick = () => {
  if (!state.localStream) return;
  state.muted = !state.muted;
  for (const t of state.localStream.getAudioTracks()) t.enabled = !state.muted;
  $('muteBtn').classList.toggle('active-mute', state.muted);
  $('muteBtn').textContent = state.muted ? '🔇' : '🎙️';
};

window.addEventListener('beforeunload', () => {
  if (state.group.active) leaveGroup();
  else if (state.peerId) endCall(true);
});

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
}
</script>
</body>
</html>
